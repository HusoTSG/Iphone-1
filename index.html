<link rel="stylesheet" href="styles.css">
<style>
/* Animation de lancement : le personnage fait une flexion, saute, puis l'écran bleu s'efface sur l'appli */
#intro { position: fixed; inset: 0; z-index: 1000; pointer-events: none; background: linear-gradient(180deg, #0a84ff, #0060e0);
  display: flex; align-items: center; justify-content: center; animation: intro-out .38s cubic-bezier(.4,0,.2,1) .9s forwards; }
#intro img { display: block; width: 52vmin; transform-origin: 50% 55%; filter: drop-shadow(0 2.5vmin 4vmin rgba(0,20,80,.3));
  animation: intro-lift .9s cubic-bezier(.33,.9,.4,1) both; }
/* L'haltère descend un peu, puis elle est soulevée d'un coup, et se repose */
@keyframes intro-lift {
  0%, 14% { transform: none; }
  34% { transform: translateY(5%) rotate(7deg) scale(.97); }
  60% { transform: translateY(-13%) rotate(-9deg) scale(1.05); }
  78% { transform: translateY(0) rotate(2deg) scale(1); }
  100% { transform: none; }
}
@keyframes intro-out { to { opacity: 0; transform: scale(1.08); } }
@media (prefers-reduced-motion: reduce) { #intro { animation: intro-out .3s ease .35s forwards !important; } #intro img { animation: none !important; } }
</style>
