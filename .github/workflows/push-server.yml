name: Serveur de notifications
on:
  workflow_dispatch:
  push:
    branches: [husofit-app]
    paths: ['push/**', '.github/workflows/push-server.yml']
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - if: env.READY != 'true'
        run: echo "Ajoute CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID dans les secrets du dépôt."
      - if: env.READY == 'true'
        uses: actions/checkout@v4
      - if: env.READY == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: push
          wranglerVersion: "4.20.0"
      - if: env.READY == 'true'
        name: Vérifier que le serveur répond
        run: |
          sleep 5
          curl -fsS https://husofit-push.husofit.workers.dev/key
          echo
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST https://husofit-push.husofit.workers.dev/schedule -H 'content-type: application/json' -d '{"sub":{"endpoint":"https://evil.example.com/x","keys":{"p256dh":"a","auth":"b"}},"at":1}')
          echo "refus d'une fausse adresse : $code"
          test "$code" = "400"
